quarkus.http.port=8080
%test.quarkus.http.test-port=0
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${IDENTITY_CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true
quarkus.jackson.fail-on-unknown-properties=false
smallrye.jwt.sign.key.location=${IDENTITY_JWT_PRIVATE_KEY_LOCATION:}
auth.jwt.issuer=${IDENTITY_JWT_ISSUER:wallet-identity}
auth.jwt.audience=${IDENTITY_JWT_AUDIENCE:wallet-clients}
quarkus.rest-client.kyc-mock.url=${KYC_MOCK_BASE_URL:https://bcp-wallet-mock.yefri.workers.dev/groups/3}
quarkus.rest-client.kyc-mock.connect-timeout=5000
quarkus.rest-client.kyc-mock.read-timeout=15000
quarkus.rest-client.kyc-mock.disable-default-mapper=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
identity.operator.key=${IDENTITY_OPERATOR_KEY:disabled}
%test.identity.operator.key=test-operator